<svg xmlns="http://www.w3.org/2000/svg" width="640" height="840" viewBox="0 0 640 840"><rect width="640" height="840" fill="#fffdf8"/><g font-family="Microsoft YaHei, sans-serif" fill="#493d31"><text x="50" y="52" font-size="12" fill="#a08b6d">证据 01 · 教学虚构材料</text><text x="320" y="116" text-anchor="middle" font-size="27">服务合同（节选）</text><path d="M50 145h540" stroke="#c7b99e"/><g font-size="16"><text x="50" y="195">甲方：某学习工作室</text><text x="50" y="232">乙方：某设计服务公司</text><text x="50" y="302" font-weight="bold">一、服务内容</text><text x="50" y="341">乙方向甲方提供课程宣传页面设计服务，</text><text x="50" y="374">交付页面设计稿及可编辑源文件。</text><text x="50" y="444" font-weight="bold">二、交付约定</text><text x="50" y="483">双方确认需求后十个工作日内提交初稿；</text><text x="50" y="516">甲方确认修改意见后，完成最终交付。</text><text x="50" y="586" font-weight="bold">三、费用支付</text><text x="50" y="625">服务总价人民币 5,000 元。签约后支付</text><text x="50" y="658">预付款 2,500 元，验收后支付余款。</text></g><path d="M50 740h540" stroke="#ddd2bf"/><text x="50" y="775" font-size="12" fill="#a08b6d">仅用于场景交互预览，不代表真实案件材料。</text><text x="580" y="775" font-size="12">1 / 1</text></g></svg>
